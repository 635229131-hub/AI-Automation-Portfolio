<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Automation Architecture</title>
  <desc id="desc">A five-stage business automation flow from business process to monitoring and improvement.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#12294a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5eead4"/></marker>
    <style>
      .heading{font:700 48px Arial,sans-serif;fill:#f8fafc}.sub{font:400 22px Arial,sans-serif;fill:#cbd5e1}.label{font:700 25px Arial,sans-serif;fill:#f8fafc}.body{font:400 18px Arial,sans-serif;fill:#dbeafe}.num{font:700 18px Arial,sans-serif;fill:#062a32}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#background)" rx="32"/>
  <circle cx="154" cy="110" r="210" fill="#2563eb" opacity=".12"/><circle cx="1290" cy="760" r="260" fill="#14b8a6" opacity=".12"/>
  <text x="720" y="94" text-anchor="middle" class="heading">AI Automation Architecture</text>
  <text x="720" y="134" text-anchor="middle" class="sub">From business opportunity to reliable, measurable automation</text>
  <g filter="url(#shadow)">
    <rect x="70" y="280" width="220" height="245" rx="22" fill="#16345d" stroke="#60a5fa" stroke-width="2"/>
    <rect x="335" y="280" width="220" height="245" rx="22" fill="#193d58" stroke="#5eead4" stroke-width="2"/>
    <rect x="600" y="280" width="240" height="245" rx="22" fill="#30315a" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="885" y="280" width="220" height="245" rx="22" fill="#194657" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="1150" y="280" width="220" height="245" rx="22" fill="#244059" stroke="#67e8f9" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#5eead4" stroke-width="5" marker-end="url(#arrow)"><path d="M290 403H325"/><path d="M555 403H590"/><path d="M840 403H875"/><path d="M1105 403H1140"/></g>
  <g>
    <circle cx="105" cy="320" r="23" fill="#5eead4"/><text x="105" y="327" text-anchor="middle" class="num">01</text>
    <text x="180" y="365" text-anchor="middle" class="label">Business Process</text><text x="180" y="404" text-anchor="middle" class="body">Map goals, people,</text><text x="180" y="432" text-anchor="middle" class="body">data, and bottlenecks</text>
    <circle cx="370" cy="320" r="23" fill="#5eead4"/><text x="370" y="327" text-anchor="middle" class="num">02</text>
    <text x="445" y="365" text-anchor="middle" class="label">Process Analysis</text><text x="445" y="404" text-anchor="middle" class="body">Identify decisions,</text><text x="445" y="432" text-anchor="middle" class="body">rules, and triggers</text>
    <circle cx="635" cy="320" r="23" fill="#c7d2fe"/><text x="635" y="327" text-anchor="middle" class="num">03</text>
    <text x="720" y="365" text-anchor="middle" class="label">AI Reasoning Layer</text><text x="720" y="404" text-anchor="middle" class="body">LLMs, retrieval,</text><text x="720" y="432" text-anchor="middle" class="body">classification, agents</text>
    <circle cx="920" cy="320" r="23" fill="#5eead4"/><text x="920" y="327" text-anchor="middle" class="num">04</text>
    <text x="995" y="365" text-anchor="middle" class="label">Automation Layer</text><text x="995" y="404" text-anchor="middle" class="body">APIs, webhooks,</text><text x="995" y="432" text-anchor="middle" class="body">workflows, integrations</text>
    <circle cx="1185" cy="320" r="23" fill="#a5f3fc"/><text x="1185" y="327" text-anchor="middle" class="num">05</text>
    <text x="1260" y="365" text-anchor="middle" class="label">Monitor &amp; Improve</text><text x="1260" y="404" text-anchor="middle" class="body">Test outcomes,</text><text x="1260" y="432" text-anchor="middle" class="body">measure and refine</text>
  </g>
  <path d="M1260 564 C1260 705 720 745 180 564" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
  <text x="720" y="734" text-anchor="middle" class="sub">Continuous feedback loop: insight from monitoring informs the next process design.</text>
  <g transform="translate(380 800)"><rect width="680" height="48" rx="24" fill="#0f203a" stroke="#334155"/><text x="340" y="31" text-anchor="middle" class="body">Business tools: CRM · Databases · Email · Internal apps · Analytics</text></g>
</svg>
